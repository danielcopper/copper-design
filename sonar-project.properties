sonar.projectKey=danielcopper_copper-design
sonar.organization=danielcopper

# What gets analysed: the package's code and its tests, the workflows and the
# dependency declarations, so every run measures how CI installs and what it
# depends on.
sonar.sources=copper_design,.github,pyproject.toml
sonar.tests=tests

# The versions the analyser holds the code to: every release from pyproject's
# requires-python floor up to the newest the analyser supports. That is the
# support surface, not the test sample: the matrix in .github/workflows/ci.yml
# samples it and does not define it. Extend the list when the floor moves or the
# analyser learns a newer interpreter; naming one it does not know clamps to its
# maximum and warns.
sonar.python.version=3.12, 3.13, 3.14

# Coverage comes from one pytest run in CI; which job runs it for which PR is
# in the comment on the `sonarcloud` job in .github/workflows/ci.yml.
sonar.python.coverage.reportPaths=coverage.xml

# Quality Gate
# Make the scanner poll the gate and exit non-zero when it fails, so the job
# that ran the scan fails with it. Which job scans which PR, and which check
# blocks the merge, is in the comment on the `sonarcloud` job in
# .github/workflows/ci.yml.
sonar.qualitygate.wait=true
