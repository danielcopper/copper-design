version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The markdownlint job's action in .github/workflows/ci.yml bundles one
      # markdownlint-cli2 version, and the `lint` task in mise.toml runs that
      # same version. A bump of the action alone would split the two, so both
      # move together, by hand.
      - dependency-name: DavidAnson/markdownlint-cli2-action
  # The Python deps: a bump moves one direct dep in uv.lock, and its pin in
  # pyproject.toml where there is one; an indirect dep moves only when such a
  # bump re-resolves it. The runtime deps are among them: a coloraide bump can
  # move the palette's hex values, which the palette tests then show. A bump of
  # the build backend's pin in pyproject.toml needs `mise run lock` for
  # build-constraints.txt, which the install tests hold to it.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
