[build-system]
# Exact pin: the package job in .github/workflows/ci.yml builds the wheel with
# it, and tests/test_ci_install.py holds it pinned.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "copper-design"
version = "0.3.0"
description = "copper, one design system for several apps: what the apps share as design tokens and artwork, and the generator that renders the tokens for each target."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Exact pins: coloraide's gamut fit decides the palette's hex values, so a new
# release moves the colours only through a reviewed bump of this line.
dependencies = ["coloraide==8.16", "jinja2==3.1.6"]

[project.optional-dependencies]
# Exact pins for the checkers, so a checker release moves only through a reviewed
# bump of this line; Dependabot proposes them.
dev = ["pytest", "pytest-cov", "ruff==0.17.5", "basedpyright==1.40.2"]

[tool.pytest.ini_options]
# The repo root first on sys.path, so the tested tree's package is the one
# imported, and every warning fails the run.
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.setuptools.packages.find]
include = ["copper_design*"]

# The generator's data, read through importlib.resources, so an installed
# package renders as the tree does; tests/test_package_data.py holds every
# non-Python file of the package to one of these patterns.
[tool.setuptools.package-data]
copper_design = ["parameters.toml", "tokens/*.json", "templates/*.j2"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["copper_design", "tests"]
exclude = [".venv", ".venv-oldest", "build", ".claude"]
reportMissingModuleSource = "none"
reportMissingImports = "warning"
reportPrivateUsage = "error"
reportRedeclaration = "none"
reportUnusedParameter = "none"
reportUnusedVariable = "warning"
reportArgumentType = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryIsInstance = "error"
reportMissingTypeArgument = "error"

[tool.ruff]
line-length = 120
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # bugbear: common pitfalls
    "SIM",  # simplify: unnecessary complexity
    "UP",   # pyupgrade: modern Python syntax
    "RUF",  # ruff-specific rules
    "ARG",  # unused arguments
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PERF", # perflint
]
